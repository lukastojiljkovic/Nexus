# Configuration for the CI secret scan (.github/workflows/security.yml).
#
# Until 2026-08-10 this file did not exist, so the scan ran on gitleaks' stock
# ruleset with nothing to say about this repository. Two of its findings are
# reviewed non-secrets, and with no way to record that review the gate could
# only ever be red or ignored — it was ignored, for ten days.
#
# THE SHAPE OF THIS FILE WAS MEASURED, NOT READ. Every allowlist mechanism the
# current documentation suggests is silently inert in the pinned gitleaks
# 8.24.3: `[[allowlists]]` (plural), `targetRules` and `matchCondition` are all
# unknown keys, and TOML drops unknown keys without a word, so a config using
# them scans exactly as if it were absent — measured against the real history,
# which still reported both findings. What works is the singular `[allowlist]`,
# whose conditions OR rather than AND. That last point is why there is no
# `paths` key below: a path entry does not narrow an exemption to a rule, it
# exempts EVERY rule inside that path, so `paths = ['.*\.test\.ts']` would have
# quietly stopped the scan from ever reporting an AWS key or a GitHub token in
# any test file. Proved by planting both and watching them vanish.
#
# So exemptions here name the literal itself. An entry is matched against the
# secret gitleaks extracted, which makes each one as narrow as it can be: it
# excuses one reviewed value and nothing that merely resembles it. The cost is
# that a new fixture of the same kind fails CI once and needs a line here — and
# that cost is the point, because it is a human looking at each high-entropy
# constant exactly once, which is the same bargain `.github/scripts/
# audit-toolchain.mjs` makes with its advisory allow-list.
#
# The counter-test lives with the change that introduced this file and is worth
# re-running whenever an entry is added: plant a real key body in the file whose
# PEM label is excused, and vendor credentials next to the excused vector. All
# of them must still fail. They do.

title = "Nexus"

[extend]
useDefault = true

[allowlist]
description = "Reviewed non-secrets, each named by the literal it excuses"
regexes = [
  # `packages/core/src/devtools/cryptoTools.ts` documents the two PEM fields of
  # `PemKeyPair` by naming their armour lines inside a JSDoc code span. The
  # `private-key` rule matches armour, not key material, so it opens on the
  # first label and closes on the second — a three-line match that is entirely
  # comment. The backtick immediately after the closing dashes is what separates
  # a label from a key: a real PEM has a newline and base64 there, so a key
  # pasted into that same file is still caught.
  '''-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----`''',

  # `packages/core/src/priv/privEnvelope.test.ts` — the known-answer vector for
  # `derivePrivBlobKey`, i.e. HKDF over a DEK that the file next door defines as
  # `bytes(32, (i) => i)`: the bytes 00,01,…,1f. Anyone can recompute it, it
  # protects nothing, and the test's whole value is that the number is fixed
  # somewhere other than in the implementation. It is flagged only because the
  # identifier says KEY and 64 hex characters carry enough entropy.
  '''^e33ced84f1f73597a2de8afa80349f9f38ab14460de0bc2488f17c71be15908c$''',

  # THE NEXT THREE ARE NOT SECRETS OF ANY KIND. They are TypeScript property
  # reads, and they are here because a rule and this codebase's oldest naming
  # convention describe the same 26 characters.
  #
  # `vault-service-token` matches a legacy HashiCorp Vault token: the letter s,
  # a dot, then 24 base62 characters, above an entropy floor and followed by a
  # quote, a backtick, a semicolon, whitespace or end of line. Every surface in
  # this app opens with `const s = strings.<module>`, so `s.someStringKey` is
  # the single most common expression in the renderer — and a string key that
  # happens to be exactly 24 characters long produces that exact shape. There
  # are 64 such reads today across 47 distinct keys; three of them clear the
  # entropy floor because they carry digits, and those three are below.
  #
  # Measured, both ways, at gitleaks 8.24.3: history scan 6 findings, working
  # tree 6 findings, the same three literals in each. `s.targetMinusDelivered
  # P2o5` is a fourth key of the same shape and entropy that does NOT fire,
  # only because every one of its call sites is followed by `}` rather than by
  # a delimiter the rule accepts — which is worth writing down, because it
  # means the population that can fire is „24-character key with a digit,
  # before a space or a quote", not „24-character key".
  #
  # Naming the literal keeps the rule armed: a real Vault token in this
  # repository is still a failure, and so is a fourth string key of this shape
  # until somebody reads it and adds it here. That last part is the cost, and
  # it is a copy change failing a security gate, which is not a good trade —
  # it is recorded in docs/STATUS.md as a question for the founder rather than
  # settled here by disabling the rule.
  '''^s\.directionPer100ToPortion$''',
  '''^s\.directionPortionToPer100$''',
  '''^s\.sensitivityReference283v$''',

  # A FOURTH key of the same shape, and this one is a correction. DC-53 recorded
  # it as one that does NOT fire, because every one of its call sites is
  # followed by `}` rather than by a delimiter the rule accepts — which is still
  # true of the code. It stopped being true of the repository on 2026-09-26,
  # when docs/ entered version control: `docs/defect-classes.md` quotes the key
  # in prose, where a backtick closes it, and the whole-history scan opens on
  # that. The fix belongs here rather than in the sentence, because a later
  # commit cannot un-scan an earlier one. Measured 2026-09-26: with this line
  # the scan is 0 findings; without it, 1, at
  # defect-classes.md:1546.
  '''^s\.targetMinusDeliveredP2o5$''',
]
