# electron-builder packaging config for @nexus/desktop.
#
# Kept as a standalone file (rather than package.json's "build" key) to match
# the repo's style of separate, purpose-named configs (electron.vite.config.ts,
# tsconfig.*.json).
#
# Native module: better-sqlite3-multiple-ciphers 13.0.3 is a Node-API addon and
# ships eight prebuilt binaries, one per platform and arch, with no ABI in the
# key. Node cannot require() a native addon from inside an asar archive, so it
# is unpacked. npmRebuild stays disabled — there is nothing to rebuild, and
# @electron/rebuild would compile from source what the package already carries.
# `files` below keeps the 14 MB amalgamation it would only need in order to
# compile one out of the installer, and says why the seven unusable binaries stay.
#
# publish: GitHub releases in THIS repository (lukastojiljkovic/Nexus).
#
# It used to name a separate `nexus-releases` repository, a plan of record from
# when Nexus was proprietary. That repository was never created and is no
# longer wanted: once the source repository is public there is no reason for a
# second one, and `site/`'s download buttons already point at this repository's
# `releases/latest`.
#
# This is a DECLARATION and nothing more. Local builds always pass
# `--publish never` (see scripts/dist.mjs), so a build never contacts GitHub;
# the release workflow uploads a DRAFT release instead; and auto-update stays
# disarmed (the SEC-EL-07 comment in src/main/index.ts lists the three
# conditions for re-arming it).

appId: rs.stojiljkovic.nexus
productName: Nexus
copyright: Copyright © 2026 Luka Stojiljkovic

# The product's one-line description, for every place the packaging layer shows
# one: the NSIS installer's Windows file description (Explorer's properties
# page and the SmartScreen prompt) and the `Comment` of the Linux .desktop
# entry (the menu tooltip). It is overridden HERE rather than fixed in
# package.json because that field's job is to tell a developer what the package
# is, and electron-builder's job for it is to tell a user what the product is —
# 1.1.0's installer shipped with „Electron main/preload/renderer … typed,
# allowlisted IPC bridge (ADR-001, SEC-EL)" as its file description. Serbian,
# like every other string a user reads.
extraMetadata:
  description: "Beleške, zadaci, kalendar, datoteke i finansije — sve na jednom mestu, lokalno i šifrovano."

# The vendor is NOT configured here — it is `author` in package.json, because
# that is the only place electron-builder looks: `appInfo.companyName` is
# `metadata.author.name`, and `winPackager` writes the executable's CompanyName
# resource *only when that is non-null*. Left unset, the resource compiled into
# the Electron binary survives verbatim, and 1.1.0 shipped a Nexus.exe whose
# Explorer properties page named „GitHub, Inc." as the company; the same field
# is the uninstall key's `Publisher`, so Windows' installed-apps list showed the
# publisher column empty. Two symptoms, one absent field — and the same class as
# the description above: nothing had ever read back what the packaging layer
# actually wrote into the shipped binaries.
# Object form in package.json, not the string shorthand — `.name` is read off
# that value without npm's normalisation.

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  # Both formats ship: the main process picks by platform, because Chromium's
  # ICO decoder exists on Windows only (src/main/index.ts, `iconFile`).
  - build/icon.ico
  - build/icon.png
  # The native module's source: 14 MB of SQLite3MultipleCiphers amalgamation
  # and its addon sources, shipped so the package CAN be built from source.
  # Nothing here ever builds it — see the `allowBuilds: false` in
  # pnpm-workspace.yaml — so it is 14 MB of installer that no code path reads.
  - "!node_modules/better-sqlite3-multiple-ciphers/{deps,src,binding.gyp}"
  # And seven of its eight prebuilds, ~17 MB of binaries this build cannot
  # load. Everything out, then the one back in — patterns are applied in order,
  # so the re-include has to come second, and `${platform}`/`${arch}` are
  # electron-builder's own macros for the TARGET, which is what makes one list
  # correct for both hosts.
  #
  # This must NOT be written as a per-platform `win:`/`linux:` `files` key.
  # That key does not ADD to this list, it REPLACES it, so every line above
  # stops applying and the default `**/*` takes over. Tried on 2026-09-04: the
  # build succeeded, said nothing, and produced a 388 MB installer with the
  # whole source tree and every devDependency inside the asar.
  #
  # A miss in the OTHER direction is worse and just as quiet — an app packaged
  # with no binary at all starts and dies at its first query. `dist.mjs` reads
  # the unpacked output afterwards and refuses to leave one behind.
  - "!node_modules/better-sqlite3-multiple-ciphers/prebuilds/*"
  - "node_modules/better-sqlite3-multiple-ciphers/prebuilds/${platform}-${arch}.node"

asarUnpack:
  - node_modules/better-sqlite3-multiple-ciphers/**/*

npmRebuild: false

# ---------------------------------------------------------------------------
# Electron fuses
# ---------------------------------------------------------------------------
# Flipped at packaging time by electron-builder's `electronFuses` option
# (supported since 24.8; this project is on 26.15.3), which drives
# `@electron/fuses`. A fuse is a byte in the executable that Electron reads
# before any application code runs, so these are the switches that still hold
# if the main process is compromised or replaced. They are applied right
# before signing, on the packaged output — never by hand.
#
#   RunAsNode off          `ELECTRON_RUN_AS_NODE=1 Nexus.exe` no longer starts
#                          a Node.js interpreter; the executable is the app.
#   NODE_OPTIONS off       the environment can no longer inject `--require` (or
#                          any switch) into a double-clicked app's main process.
#   CLI inspect off        `--inspect` on the command line cannot open a
#                          debugger port for a local process to attach to.
#   Cookie encryption on   Chromium cookies at rest go through the OS keystore
#                          (DPAPI) instead of lying in the profile in the clear.
#   Asar integrity on      the `app.asar` header's SHA-256 is embedded in the
#                          executable and checked at load, so an edited archive
#                          refuses to start rather than running its new contents.
#   Only load from asar    the app may not be loaded from a loose `app/`
#                          directory beside the executable — the shape used to
#                          sidestep the integrity check above.
#
# `GrantFileProtocolExtraPrivileges` stays ON, deliberately: the renderer is
# loaded from `file://` (electron-vite's production output), and turning this
# off breaks a file:// page's access to its own resources. Revisit it only when
# the renderer is served from a custom protocol or a real origin.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: "Nexus-Setup-${version}.exe"
  # Uninstaller: build/installer.nsh's customUnInstall offers optional removal
  # of the user's local data ($APPDATA\Nexus + updater cache), default keep;
  # skipped entirely when the uninstall runs as part of an auto-update.
  include: build/installer.nsh

linux:
  # AppImage runs on any glibc desktop with no packaging at all — which is what
  # makes it the honest answer for a distribution we do not build on. tar.gz is
  # the payload the Gentoo ebuild (build/gentoo/) unpacks into /opt; a `-bin`
  # ebuild is how a binary Electron app is packaged for Gentoo, since portage
  # will not compile Chromium from our tree.
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
  icon: build/icon.png
  # freedesktop main category. „Utility" is the registry's own name for a tool
  # the user runs directly and that is not an office suite or a game.
  category: Utility
  # deb/rpm short description. Serbian for the same reason `extraMetadata`
  # above is: it is shown to whoever installs the package.
  synopsis: Sve na jednom mestu — lokalno i šifrovano
  # A lowercase, spaceless binary is the Linux convention and is also what the
  # .desktop Exec/Icon keys and the ebuild's install paths are written against.
  executableName: nexus
  # Window association. Electron derives its app_id from `desktopName` in
  # package.json; syncDesktopName makes electron-builder name the installed
  # .desktop file and its StartupWMClass from the same string, so the running
  # window is linked to its launcher instead of appearing as an unnamed second
  # icon in the dock. The two must stay equal to `appId` above.
  syncDesktopName: true
  # tar.gz (and any other linux target without its own artifactName). `${ext}`
  # is the target's own name, so this reads „tar.gz" here.
  artifactName: "nexus-${version}-linux-${arch}.${ext}"
  # A second copy of the icon, beside the executable rather than inside the
  # asar. electron-builder only generates the .desktop entry and the hicolor
  # icons for targets that install something (AppImage, deb, rpm) — a tar.gz is
  # just the directory, so the Gentoo ebuild has to supply both, and it can only
  # supply an icon it can read. Same generated file as `icon:` above, so the
  # launcher icon and the window icon cannot disagree.
  extraFiles:
    - from: build/icon.png
      to: icon.png

toolsets:
  # The AppImage runtime. electron-builder's default („0.0.0") is the FUSE2
  # toolset, and its output cannot start without `libfuse.so.2` on the host —
  # a library Ubuntu 22.04+, Fedora 38+ and Gentoo all stopped installing when
  # they moved to FUSE 3. This is measured, not assumed: the first build here
  # died on Ubuntu 24.04 with „dlopen(): error loading libfuse.so.2" before a
  # line of app code ran. 1.0.3 embeds a static runtime and needs no FUSE at
  # all, which is the only version of „runs anywhere with no packaging" that is
  # actually true.
  appimage: "1.0.3"

appImage:
  artifactName: "Nexus-${version}-${arch}.AppImage"
  # Chromium's sandbox stays ON. The FUSE2 toolset defaults these to
  # `["--no-sandbox"]`, which would be a real downgrade for this app in
  # particular: the renderer displays user-supplied documents and attachments,
  # which is exactly the case an OS sandbox exists for. The static runtime above
  # already defaults to an empty list; stating it here keeps the guarantee
  # independent of which toolset is selected, and an empty array IS honoured
  # (`?? defaultArgs` only fires on undefined). The cost is a host with
  # unprivileged user namespaces disabled — there the AppImage refuses to start
  # instead of starting unprotected, and build/gentoo/README.md says what to do.
  executableArgs: []

publish:
  provider: github
  owner: lukastojiljkovic
  repo: Nexus
