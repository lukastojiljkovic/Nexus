# Overlay metadata for the "nexus" repository.
#
# masters = gentoo: every eclass and profile this overlay uses (desktop.eclass,
# xdg.eclass, the license list) lives in ::gentoo. Without this line portage
# resolves eclasses against this repository alone and the ebuild fails to
# inherit anything.

masters = gentoo

# BLAKE2B + SHA512 is what portage writes today; naming them here keeps a
# hand-written Manifest byte-identical to a regenerated one.
manifest-hashes = BLAKE2B SHA512
manifest-required-hashes = BLAKE2B

# Thin manifests record only the distfiles, exactly as ::gentoo does since it
# moved to git: the repository itself is version-controlled, so hashing the
# ebuild inside the ebuild's own directory buys nothing and turns every comment
# fix into a Manifest regeneration.
thin-manifests = true
sign-manifests = false
