name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never launches Electron; skip the ~100 MB binary download in postinstall.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version is read from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fast, dependency-free static check — the CLAUDE.md/README.md
      # design-token rule (no raw colour literal outside packages/tokens)
      # made into a real gate. Runs first: it needs no build output and
      # should fail before the slower steps spend any time.
      - run: pnpm check:colours

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test
