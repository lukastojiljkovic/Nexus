name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never launches Electron; skip the ~100 MB binary download in postinstall.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

# EVERY `uses:` IN THIS REPOSITORY IS PINNED TO A 40-CHARACTER COMMIT SHA, with
# the human-readable tag as a trailing comment.
#
# A tag is a mutable pointer. In March 2025 an attacker repointed EVERY tag of
# `tj-actions/changed-files` — including tags that had been stable for years —
# at one malicious commit that dumped CI secrets into the build log
# (CVE-2025-30066). Nobody had to be compromised downstream; everyone who wrote
# `@v35` was running the new code within minutes.
#
# `@v7` and `@v7.0.1` are equally mutable; only a SHA is not. Dependabot
# understands SHA pins and keeps them current, so this costs a review rather
# than an upgrade path. The tag comment is what makes the diff readable — a bare
# SHA bump is unreviewable, `# v7` → `# v8` is not.
#
# This becomes load-bearing rather than prudent the moment a deploy workflow
# holds a `CLOUDFLARE_API_TOKEN` or a Supabase key: at that point a third-party
# action is a path to the production credentials, and the rule is that the
# deploy workflow uses NO third-party action at all.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pnpm version is read from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The five static gates — the rules CLAUDE.md and README.md state in
      # prose, made executable. None of them needs build output, all of them
      # are seconds, so they run first and fail before the slower steps spend
      # any time.
      #
      # ALL of them, which is the point. For months this job invoked
      # `check:colours` alone while `check:contrast`, `check:css`,
      # `check:strings` and `check:tokens` were written, wired into
      # `package.json`, given their own unit tests — and run nowhere except on
      # the machine of whoever remembered. A gate that only fires when someone
      # types it is a convention, not a gate: four rules the repo believed it
      # enforced were, on every pull request, enforcing nothing. `check:tokens`
      # exists precisely because an undefined custom property is invisible, and
      # it was itself invisible.
      #
      # One step each rather than one combined step: the run summary then names
      # the rule that broke, so a red check is diagnosable before opening a log.
      - run: pnpm check:colours

      - run: pnpm check:contrast

      - run: pnpm check:css

      - run: pnpm check:strings

      - run: pnpm check:tokens

      # A character that renders as nothing, or as a character it is not. This
      # one has to run here rather than in review, because review is exactly
      # what it defeats: a non-breaking space is a space in every editor, in
      # `git diff` and on GitHub, and the file compiles and typechecks around it.
      - run: pnpm check:invisibles

      # The sentence the professional drawer rests on, made executable. Forty of
      # its tools may compute a quantity and may never judge it, and both halves
      # of that fail silently: a deleted `<ToolRiskNotice/>` renders nothing,
      # which is what a harmless tool renders, and „u granicama" under a ratio
      # looks like helpfulness. This is also the one gate whose red run is a
      # legal exposure rather than a style complaint.
      - run: pnpm check:risk

      # The other half of the same drawer: not what the tools SAY, but what
      # their arithmetic does when an input is missing. Two verification rounds
      # over the 274 tools produced 63 correctness findings and 36 of them were
      # one shape — a divisor that reached the division unguarded, printing
      # „∞ mm" on a surface where it reads as a rendering bug. Every hand-rolled
      # copy of the fix was written by somebody who needed a rounding helper and
      # could not see one, which is what will happen again on the day an
      # eighteenth toolkit is added.
      - run: pnpm check:pro-math

      # The third of the drawer: not what a tool computes, but what it says
      # ABOUT what it computed. A boolean on a result is a caveat — „n = 3, do
      # not read these as quartiles", „this zero is the target already met",
      # „this amount is negative and the figures beside the words are not". Three
      # such flags were computed, tested, exported and never named by any
      # screen, so each user met exactly the misreading the flag was written to
      # prevent. Nothing else here can see it: skipping one field of a result is
      # well-typed, an unused PROPERTY is not an unused variable, and the defect
      # is a line that is not there.
      - run: pnpm check:pro-flags

      # The third-party notices are a GENERATED file that is committed, and
      # nothing regenerated it when the dependency tree moved. `licences.test.ts`
      # asks whether the committed file is fit to ship — every entry carries a
      # notice, nothing is UNKNOWN — and cannot ask whether it still describes
      # this tree, because it only ever reads the file. On 2026-08-15 it did
      # not: it credited dompurify 3.4.12, js-yaml 4.3.0, mermaid 11.16.0 and
      # nanoid 3.3.16 while the installer shipped 3.4.13, 4.3.1, 11.16.1 and
      # 3.3.18 — and three of those four are the packages the security
      # overrides moved, so the „Licence" card was naming the OLD, vulnerable
      # version of a dependency the product had already patched. This runs the
      # generator and compares bytes; it is sound because the generator is
      # deterministic on the same node_modules and normalises path separators.
      - run: pnpm check:licences

      # The style half of the cloud-off boundary. The ASSERTION is
      # `apps/desktop/src/main/net/offline.ts` and its unit tests; this catches
      # a new egress construct before it ever has to be caught at runtime.
      - run: pnpm check:egress

      # Reads the migration SQL as text and needs no database, so it belongs
      # with the other static gates. It catches „the new table's migration
      # forgot a line"; the `database` job below catches „the line is there and
      # Postgres disagrees". Both, because they are not the same claim.
      - run: pnpm check:rls

      # And the mutation suite BEHIND that checker, which until now nothing ran
      # — not `pnpm test`, not this workflow. `check:rls` proves the current
      # migrations pass; it says nothing about whether a rule could ever fail,
      # and a gate that has never been observed to fail is indistinguishable
      # from one that cannot. These 38 break the real migrations one line at a
      # time and demand the specific complaint. (Also reached by `pnpm test`.)
      - run: pnpm test:wall

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  # THE WALL, RUN RATHER THAN READ.
  #
  # A separate job because it needs something no other step does: a live
  # Postgres with GoTrue's `auth` schema, the `anon`/`authenticated`/
  # `service_role` roles and Supabase's own `storage`/`realtime` tables. Half of
  # what the pgTAP assertions prove is about the interaction between this
  # repository's policies and objects the platform created, so a bare `postgres`
  # service container would prove the wrong thing.
  #
  # It is also the job that has already earned its keep. On its first run
  # against a real Postgres 17 it failed two assertions that had read as
  # correct for as long as they had existed — `storage.objects` and
  # `realtime.messages` cannot be FORCED by any role a Supabase project issues —
  # and it changed an `is_empty` into a `throws_ok` by showing that `anon` is
  # refused a table before a policy is ever consulted. Neither is findable by
  # reading SQL.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: latest

      # The whole stack rather than `-x` a list of services. The tests assert
      # against `storage.buckets`, `storage.objects` and `realtime.messages`,
      # and which of those schemas exist without their containers running is a
      # detail of the Postgres image that would silently change under us. A
      # slower job that tests the real shape beats a faster one that tests a
      # shape no deployment has.
      - run: supabase start

      # From scratch, so a migration that only works against an
      # already-migrated database fails here rather than on the day it is
      # deployed.
      - run: supabase db reset

      - run: supabase test db

      # THE OTHER HALF OF THE SERVER CONTRACT, and the only place it is ever
      # executed. pgTAP proves what Postgres does; this proves what PostgREST
      # does with it — how `bytea` is spelled on the wire, that a filter value
      # must be percent-encoded and never quoted, that a PATCH matching no row
      # is a silent HTTP 200, that an upsert is refused at the privilege layer,
      # and which SQLSTATE reaches a client for each trigger rule. Every one of
      # those was measured rather than derived, and four of them contradict what
      # the documentation implies — so they are exactly the rules that rot
      # silently if nothing re-runs them.
      #
      # It hangs off this job because it needs the running stack the job already
      # has. `verify` runs the same suite and it skips itself there — correctly,
      # there is no server — so `pnpm test` being green says nothing about any
      # of the above, and this step is what stops that being mistaken for
      # coverage. `set -u` is what makes a `supabase status` that yielded
      # nothing fail the job here, rather than one step later and further away.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `supabase status -o env` prints the local stack's own keys, which are
      # the well-known development ones and are NOT secrets — they are fixed
      # constants of the CLI, identical on every machine that runs it. Read from
      # the running stack rather than pasted here so this step cannot drift into
      # asserting against a project that is not the one the job just started.
      - name: The wire, against the running PostgREST
        run: |
          set -euo pipefail
          # Only NAME="value" lines. `status` also prints a deprecation warning
          # and a „Stopped services" note, and `eval`-ing either of those under
          # `set -e` fails the job with a shell syntax error that says nothing
          # about what actually happened.
          eval "$(supabase status -o env | grep -E '^[A-Z0-9_]+=' | sed 's/^/export /')"
          NEXUS_LIVE_SUPABASE_URL="$API_URL" \
          NEXUS_LIVE_ANON_KEY="$ANON_KEY" \
          NEXUS_LIVE_SERVICE_KEY="$SERVICE_ROLE_KEY" \
          NEXUS_LIVE_JWT_SECRET="$JWT_SECRET" \
            pnpm --filter @nexus/sync-transport test

      # THE EDGE FUNCTIONS, which neither pgTAP nor the step above touches.
      # `sync-enable` decides everything it decides from state only GoTrue
      # writes — whether a session exists, its assurance, which factors were
      # presented, when the factor was armed relative to the session — so a test
      # that mocks the auth server tests the mock. This suite signs in for real,
      # enrols and verifies a real TOTP factor, and steps a session up.
      #
      # It also pins a platform behaviour nothing in our code reads as depending
      # on: an MFA step-up REVOKES the account's other sessions, which is why the
      # desktop must obtain its device session after the step-up and not before.
      - name: The edge functions, against the running stack
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep -E '^[A-Z0-9_]+=' | sed 's/^/export /')"
          NEXUS_LIVE_SUPABASE_URL="$API_URL" \
          NEXUS_LIVE_ANON_KEY="$ANON_KEY" \
          NEXUS_LIVE_SERVICE_KEY="$SERVICE_ROLE_KEY" \
            pnpm test:live
