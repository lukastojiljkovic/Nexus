name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never launches Electron; skip the ~100 MB binary download in postinstall.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

# EVERY `uses:` IN THIS REPOSITORY IS PINNED TO A 40-CHARACTER COMMIT SHA, with
# the human-readable tag as a trailing comment.
#
# A tag is a mutable pointer. In March 2025 an attacker repointed EVERY tag of
# `tj-actions/changed-files` — including tags that had been stable for years —
# at one malicious commit that dumped CI secrets into the build log
# (CVE-2025-30066). Nobody had to be compromised downstream; everyone who wrote
# `@v35` was running the new code within minutes.
#
# `@v7` and `@v7.0.1` are equally mutable; only a SHA is not. Dependabot
# understands SHA pins and keeps them current, so this costs a review rather
# than an upgrade path. The tag comment is what makes the diff readable — a bare
# SHA bump is unreviewable, `# v7` → `# v8` is not.
#
# This becomes load-bearing rather than prudent the moment a deploy workflow
# holds a `CLOUDFLARE_API_TOKEN` or a Supabase key: at that point a third-party
# action is a path to the production credentials, and the rule is that the
# deploy workflow uses NO third-party action at all.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pnpm version is read from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The five static gates — the rules CLAUDE.md and README.md state in
      # prose, made executable. None of them needs build output, all of them
      # are seconds, so they run first and fail before the slower steps spend
      # any time.
      #
      # ALL of them, which is the point. For months this job invoked
      # `check:colours` alone while `check:contrast`, `check:css`,
      # `check:strings` and `check:tokens` were written, wired into
      # `package.json`, given their own unit tests — and run nowhere except on
      # the machine of whoever remembered. A gate that only fires when someone
      # types it is a convention, not a gate: four rules the repo believed it
      # enforced were, on every pull request, enforcing nothing. `check:tokens`
      # exists precisely because an undefined custom property is invisible, and
      # it was itself invisible.
      #
      # One step each rather than one combined step: the run summary then names
      # the rule that broke, so a red check is diagnosable before opening a log.
      - run: pnpm check:colours

      - run: pnpm check:contrast

      - run: pnpm check:css

      - run: pnpm check:strings

      # Serbian has no genderless past tense, so „šta si uneo" has chosen the
      # reader's gender — and the only one it ever chose was masculine. This is
      # invisible to every other instrument: it is valid Serbian, valid
      # TypeScript, and photographs correctly; forty lines shipped, six
      # file headers told the next author to copy the phrasing, and review
      # missed all of it.
      - run: pnpm check:address

      # Serbian closes a quotation with “, never with ” and never with an
      # ASCII ". Inside a double-quoted literal the ASCII one has to be escaped,
      # which is what made it look deliberate: 172 of roughly 375 quoted phrases
      # in the shipped copy — more than a third, over 29 files — closed with the
      # wrong mark, sometimes both forms inside one sentence. All of it
      # typechecks, lints, passes `check:address` and photographs as a quotation
      # mark of some kind, so nothing else in this repository could see it.
      - run: pnpm check:quotes

      - run: pnpm check:tokens

      # DEV-006 exempts the Elektronika workbench from the ban on blue and
      # orange, because inside a wiring diagram a colour is data. The deviation
      # says the exemption reaches the canvas and its legend „and nothing else",
      # which is a rule over a reachability set — nothing in CSS tells a blue
      # jumper apart from a blue button, and `check:colours` is satisfied by
      # both. This is the sentence, enforced.
      - run: pnpm check:elec

      # The design system replaces the OS radio and checkbox. A bare
      # `<input type="radio">` is 13x13, grey in both themes, and eleven pixels
      # under the pointer floor. Nothing else here can see it: it uses no
      # colour, declares no token, and typechecks. The third instance was found
      # by hand, inside a form three modal steps deep, which is where the
      # screenshot sweep does not go.
      - run: pnpm check:controls

      # The same shape one component over, and the last step of DC-120. The
      # design system's field was bypassed by hand — eleven times when the
      # class was counted, and the count was wrong: the rule looked for the
      # shared class NAME, so two fields wearing a local one were never seen at
      # all. `noteFindBar.tsx`'s carried the primitive's recipe as prose in
      # notes.css, eight declarations of which five were the primitive's own
      # words character for character, which is why no instrument here could
      # watch it drift. This gate asks what an `<input>` IS — its `type` — and
      # not what it is called, so a hand-rolled copy is found on the day it is
      # written whatever it is named. `radio`, `checkbox`, `range` and `file`
      # are another component's subject or nobody's; everything else, `date` and
      # `time` included, goes through `TextField`.
      - run: pnpm check:fields

      # A shared typographic tier, retyped. `.nx-hint` is muted 13px prose with
      # the app's leading and a 68ch measure; before it existed, thirty-three
      # classes across fifteen stylesheets wrote those declarations out by hand,
      # and had drifted to four leadings, three measures and forty-eight
      # paragraphs still carrying the UA's `<p>` margin. Every copy uses tokens,
      # so `check:colours` and `check:tokens` pass it; each one is locally
      # correct, which is why only counting them shows anything. The rule reads
      # the markup as well as the CSS, because the discriminator is the element:
      # a class that is only ever a `<p>`.
      - run: pnpm check:tiers

      # A labelled field is two boxes tall and a bare input, a button or an
      # `inline` select is one, so a row holding both has children of two
      # heights — and there `align-items: center` centres the BOXES, which puts
      # every control on its own baseline, half a label apart. Four forms
      # shipped that way and none of them looked wrong, because while every
      # child was one box tall `center` and `end` draw the same picture; they
      # all went ragged on the afternoon DC-120's labels arrived. Neither half
      # can see it alone: the stylesheet cannot say what is in the row, and
      # `center` is right on the fifty-odd toolbars and chip rows that are not
      # this, while the markup cannot say how the row is laid out. So the rule
      # reads both, and fires only where the children mix.
      - run: pnpm check:rows

      # A stacking order is a property of the whole app, and this one existed
      # nowhere: twenty-two z-index values across eleven files, each chosen at
      # its own call site, so `1` meant „pinned over my rows" in seven places
      # and „the lower of two pinned ranks" in an eighth. The only statement of
      # the ladder was prose — five comments in notes.css re-listed it by hand,
      # one still naming a layer 40 nothing had carried for months and one
      # recording a hazard that was never real — written from the JSX tree the
      # day after the dialogs it named started portalling to `document.body`.
      # Invisible to every other check: each value is a valid integer, and the sweep
      # photographs a correct order and an accidental one identically, because
      # they differ only where two boxes meet. The scale itself is checked too,
      # since every call site would still pass if a layer moved under another.
      - run: pnpm check:layers

      # A field's accessible name is its NAME, never its name and its
      # explanation. A `<label>` that WRAPS its control takes the element's
      # entire text content as the name, so an `.nx-hint` inside one is read out
      # as part of it: UČENJE's two daily caps announced themselves as „Novih
      # kartica dnevno Najviše 200 novih kartica dnevno", and PRIVATNO's four
      # credential choices do it to their radios at the foot of a form where a
      # screen reader hears „Zasebna šifra za Privatno Zasebna šifra ostaje na
      # ovom uređaju…" as one utterance. The arrangement is exactly what the
      # design asks for — name above, control, hint below — so it renders
      # correctly, lints, typechecks and photographs clean; only the WRAPPING is
      # wrong, and only for a reader who cannot see it. It needs no exemption
      # list, because „a wrapping label holding a control and an explanation" is
      # a statement about what the label contains.
      - run: pnpm check:names

      # A character that renders as nothing, or as a character it is not. This
      # one has to run here rather than in review, because review is exactly
      # what it defeats: a non-breaking space is a space in every editor, in
      # `git diff` and on GitHub, and the file compiles and typechecks around it.
      - run: pnpm check:invisibles

      # A key erased in the middle of the call that is using it. `finally` runs
      # at the RETURN STATEMENT, not when the returned promise settles, so
      # `try { return openAll(mk) } finally { zeroize(mk) }` decrypts under 32
      # zero bytes — and reports it as `wrap/commitment-mismatch`, whose message
      # accuses the server of serving somebody else's row.
      - run: pnpm check:zeroize

      # An id validated for existence and nothing else. Both trust boundaries
      # did it — `nonEmptyStr(raw.profileId, …)` in the archive reader,
      # `asNonEmptyString(payload.id, …)` on the IPC wire — and nothing
      # downstream bounds one: stores write through prepared statements, and no
      # migration CHECKs an id column past NOT NULL. So a ten-megabyte
      # `profileId` landed in the database and every later query carried it.
      # Invisible to the rest of the tree because the call LOOKS validated:
      # `string` is `string`, it lints, and it names the field it refuses.
      - run: pnpm check:ids

      # The sentence the professional drawer rests on, made executable. Forty of
      # its tools may compute a quantity and may never judge it, and both halves
      # of that fail silently: a deleted `<ToolRiskNotice/>` renders nothing,
      # which is what a harmless tool renders, and „u granicama" under a ratio
      # looks like helpfulness. This is also the one gate whose red run is a
      # legal exposure rather than a style complaint.
      - run: pnpm check:risk

      # The other half of the same drawer: not what the tools SAY, but what
      # their arithmetic does when an input is missing. Two verification rounds
      # over the 274 tools produced 63 correctness findings and 36 of them were
      # one shape — a divisor that reached the division unguarded, printing
      # „∞ mm" on a surface where it reads as a rendering bug. Every hand-rolled
      # copy of the fix was written by somebody who needed a rounding helper and
      # could not see one, which is what will happen again on the day an
      # eighteenth toolkit is added.
      - run: pnpm check:pro-math

      # The third of the drawer: not what a tool computes, but what it says
      # ABOUT what it computed. A boolean on a result is a caveat — „n = 3, do
      # not read these as quartiles", „this zero is the target already met",
      # „this amount is negative and the figures beside the words are not". Three
      # such flags were computed, tested, exported and never named by any
      # screen, so each user met exactly the misreading the flag was written to
      # prevent. Nothing else here can see it: skipping one field of a result is
      # well-typed, an unused PROPERTY is not an unused variable, and the defect
      # is a line that is not there.
      - run: pnpm check:pro-flags

      # The third-party notices are a GENERATED file that is committed, and
      # nothing regenerated it when the dependency tree moved. `licences.test.ts`
      # asks whether the committed file is fit to ship — every entry carries a
      # notice, nothing is UNKNOWN — and cannot ask whether it still describes
      # this tree, because it only ever reads the file. On 2026-08-15 it did
      # not: it credited dompurify 3.4.12, js-yaml 4.3.0, mermaid 11.16.0 and
      # nanoid 3.3.16 while the installer shipped 3.4.13, 4.3.1, 11.16.1 and
      # 3.3.18 — and three of those four are the packages the security
      # overrides moved, so the „Licence" card was naming the OLD, vulnerable
      # version of a dependency the product had already patched. This runs the
      # generator and compares bytes; it is sound because the generator is
      # deterministic on the same node_modules and normalises path separators.
      - run: pnpm check:licences

      # The style half of the cloud-off boundary. The ASSERTION is
      # `apps/desktop/src/main/net/offline.ts` and its unit tests; this catches
      # a new egress construct before it ever has to be caught at runtime.
      - run: pnpm check:egress

      # The SECOND capability boundary, and the sharper of the two: a network
      # call leaves the machine, and a process runs ON it. Until ADR-085 slice E6
      # the shipped app contained no `child_process` call at all, so this is a
      # new kind of gate rather than a new file in an old kind.
      #
      # Four rules are the deviation's own first sentence — **the command line is
      # never data** — enforced rather than remembered: the module, the shell
      # option, the exec family, and a literal program name at a call site. Three
      # of those four are exempted for NOBODY (a startup check in the gate refuses
      # an allowlist entry that tries), and the module itself for exactly one file
      # plus its test. The fifth rule is vocabulary — a file that NAMES a tool is
      # not a file that runs one — and it is the one with many exemptions, each
      # carrying its reason in the gate.
      #
      # The interaction that does the work is worth naming because it reads like a
      # coincidence: the one file allowed to import `child_process` is NOT allowed
      # to contain a toolchain word, so the program it starts can only be `argv[0]`
      # of a plan that came out of `packages/core/src/electronics/runner.ts`. The
      # one file permitted to spawn is the one file that may not know what it is
      # spawning.
      - run: pnpm check:runner

      # Reads the migration SQL as text and needs no database, so it belongs
      # with the other static gates. It catches „the new table's migration
      # forgot a line"; the `database` job below catches „the line is there and
      # Postgres disagrees". Both, because they are not the same claim.
      - run: pnpm check:rls

      # The server migration series is numbered, unique, in filename order, and
      # every citation of it resolves. This repository has TWO migration series
      # and both number from 001 — the local SQLite schema is at 069 — so a bare
      # „migration 006" is a sentence that names its evidence by a number the
      # evidence does not carry. One was written that way, in
      # `packages/sync-transport/src/signal.ts`, for the realtime policies that
      # are in this series' 004; a reader grepping it landed on the flashcards
      # table. Scope is the `supabase/` tree alone, where there is one series and
      # nothing to exempt. It also keeps the README's tree listing complete,
      # because that listing is hand-kept beside a directory that is not and had
      # already lost four migrations by omission.
      - run: pnpm check:migrations

      # And the mutation suite BEHIND that checker, which until now nothing ran
      # — not `pnpm test`, not this workflow. `check:rls` proves the current
      # migrations pass; it says nothing about whether a rule could ever fail,
      # and a gate that has never been observed to fail is indistinguishable
      # from one that cannot. These 77 — four files, counted by running it
      # rather than by copying the figure that stood here before — break the
      # real SQL one line at a time and demand the specific complaint. (Also
      # reached by `pnpm test`.)
      - run: pnpm test:wall

      # Every leaf of the user-facing copy table is read by something. No other
      # instrument in the tree can see an unread one: it type-checks, it lints,
      # it passes `check:strings`, it carries no colour and no token, and it
      # photographs as nothing at all — because it is not on screen.
      #
      # The gate was written before the copy was fixed, and found 24. It was
      # held out of this file until they were answered, because
      # `scripts/ci-workflow.test.mjs` derives its step list from `package.json`
      # and asserts each gate has a step here — so registering it while it was
      # red would have turned this workflow red for every other workstream at
      # once. It is registered in the commit that resolves them.
      - run: pnpm check:copy

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

  # THE WALL, RUN RATHER THAN READ.
  #
  # A separate job because it needs something no other step does: a live
  # Postgres with GoTrue's `auth` schema, the `anon`/`authenticated`/
  # `service_role` roles and Supabase's own `storage`/`realtime` tables. Half of
  # what the pgTAP assertions prove is about the interaction between this
  # repository's policies and objects the platform created, so a bare `postgres`
  # service container would prove the wrong thing.
  #
  # It is also the job that has already earned its keep. On its first run
  # against a real Postgres 17 it failed two assertions that had read as
  # correct for as long as they had existed — `storage.objects` and
  # `realtime.messages` cannot be FORCED by any role a Supabase project issues —
  # and it changed an `is_empty` into a `throws_ok` by showing that `anon` is
  # refused a table before a policy is ever consulted. Neither is findable by
  # reading SQL.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The ACTION is SHA-pinned like every other, and until 2026-08-31 the tool
      # it installs was `latest` — which put the entire pin back where it came
      # from. The action fetches a CLI, and each CLI release pins its own set of
      # Docker image tags for Postgres, PostgREST, GoTrue, Realtime, Storage and
      # the rest; with `latest`, this job re-resolved that whole stack on every
      # run, with no commit in this repository to point at. That is worse than an
      # unpinned dependency, because the job's PURPOSE is to say whether the
      # migrations are sound: when it goes red, „the SQL broke" and „the
      # toolchain moved under us" have to be distinguishable, and under `latest`
      # they are not. Bump this deliberately; a stale CLI against a LOCAL stack
      # costs nothing, and the bump is then a diff somebody read.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v1
        with:
          version: 2.116.0

      # The whole stack rather than `-x` a list of services. The tests assert
      # against `storage.buckets`, `storage.objects` and `realtime.messages`,
      # and which of those schemas exist without their containers running is a
      # detail of the Postgres image that would silently change under us. A
      # slower job that tests the real shape beats a faster one that tests a
      # shape no deployment has.
      - run: supabase start

      # From scratch, so a migration that only works against an
      # already-migrated database fails here rather than on the day it is
      # deployed.
      - run: supabase db reset

      - run: supabase test db

      # THE OTHER HALF OF THE SERVER CONTRACT, and the only place it is ever
      # executed. pgTAP proves what Postgres does; this proves what PostgREST
      # does with it — how `bytea` is spelled on the wire, that a filter value
      # must be percent-encoded and never quoted, that a PATCH matching no row
      # is a silent HTTP 200, that an upsert is refused at the privilege layer,
      # and which SQLSTATE reaches a client for each trigger rule. Every one of
      # those was measured rather than derived, and four of them contradict what
      # the documentation implies — so they are exactly the rules that rot
      # silently if nothing re-runs them.
      #
      # It hangs off this job because it needs the running stack the job already
      # has. `verify` runs the same suite and it skips itself there — correctly,
      # there is no server — so `pnpm test` being green says nothing about any
      # of the above, and this step is what stops that being mistaken for
      # coverage. `set -u` is what makes a `supabase status` that yielded
      # nothing fail the job here, rather than one step later and further away.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `supabase status -o env` prints the local stack's own keys, which are
      # the well-known development ones and are NOT secrets — they are fixed
      # constants of the CLI, identical on every machine that runs it. Read from
      # the running stack rather than pasted here so this step cannot drift into
      # asserting against a project that is not the one the job just started.
      - name: The wire, against the running PostgREST
        run: |
          set -euo pipefail
          # Only NAME="value" lines. `status` also prints a deprecation warning
          # and a „Stopped services" note, and `eval`-ing either of those under
          # `set -e` fails the job with a shell syntax error that says nothing
          # about what actually happened.
          eval "$(supabase status -o env | grep -E '^[A-Z0-9_]+=' | sed 's/^/export /')"
          NEXUS_LIVE_SUPABASE_URL="$API_URL" \
          NEXUS_LIVE_ANON_KEY="$ANON_KEY" \
          NEXUS_LIVE_SERVICE_KEY="$SERVICE_ROLE_KEY" \
          NEXUS_LIVE_JWT_SECRET="$JWT_SECRET" \
            pnpm --filter @nexus/sync-transport test

      # THE EDGE FUNCTIONS, which neither pgTAP nor the step above touches.
      # `sync-enable` decides everything it decides from state only GoTrue
      # writes — whether a session exists, its assurance, which factors were
      # presented, when the factor was armed relative to the session — so a test
      # that mocks the auth server tests the mock. This suite signs in for real,
      # enrols and verifies a real TOTP factor, and steps a session up.
      #
      # It also pins a platform behaviour nothing in our code reads as depending
      # on: an MFA step-up REVOKES the account's other sessions, which is why the
      # desktop must obtain its device session after the step-up and not before.
      - name: The edge functions, against the running stack
        run: |
          set -euo pipefail
          eval "$(supabase status -o env | grep -E '^[A-Z0-9_]+=' | sed 's/^/export /')"
          NEXUS_LIVE_SUPABASE_URL="$API_URL" \
          NEXUS_LIVE_ANON_KEY="$ANON_KEY" \
          NEXUS_LIVE_SERVICE_KEY="$SERVICE_ROLE_KEY" \
            pnpm test:live
