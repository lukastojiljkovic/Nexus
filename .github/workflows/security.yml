name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly sweep, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks reads a PR's commits via the API on pull_request events
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not just the tip commit
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # SEC-SC-04 wants a dependency scan blocking the merge; SEC-VER-03 sets the
  # bar it blocks at — "any known-exploitable dependency vulnerability". Two
  # commands, because "exploitable" means something different on either side of
  # the packaging boundary.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # matches the root package.json engines field

      # What lands on a user's machine. Reachable by definition, so the bar is
      # every severity down to `low` and there are no exceptions — this command
      # must never grow an `--ignore`. It is also why `pnpm-workspace.yaml`
      # carries no `auditConfig.ignoreGhsas`: an ignore there would apply here.
      - name: Shipped dependencies
        run: pnpm audit --prod --audit-level low

      # The rest of the tree, which is the build toolchain — plus electron
      # itself, a devDependency that very much ships, so it is covered here.
      # Blocks on every high and critical advisory except the ones the script's
      # allow-list names, each with its reasoning and the condition that
      # retires it; an allowance that stops matching fails the job too, so a
      # spent excuse cannot linger. See the script for why this is not a flag.
      - name: Build toolchain
        run: node .github/scripts/audit-toolchain.mjs
