name: Scorecard

on:
  # A change to branch protection is exactly the kind of supply-chain regression
  # Scorecard measures, so it re-runs when the rules change.
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 3"
  push:
    branches: [main]

permissions:
  contents: read

# EVERY `uses:` IS PINNED TO A 40-CHARACTER COMMIT SHA with the tag as a
# comment — see ci.yml.
#
# WHY THIS JOB NO-OPS TODAY. Scorecard reads a PUBLIC repository's settings and
# publishes its result to the OpenSSF API so the badge and the public dataset
# have something to point at; on a private repository it has nothing to read and
# `publish_results` is refused. `!github.event.repository.private` is the same
# gate pages.yml uses, so this turns itself on with the visibility switch.

jobs:
  analysis:
    name: Scorecard analysis
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Uploading the SARIF result to the code-scanning API.
      security-events: write
      # `publish_results` uses the workflow's OIDC identity to prove where the
      # result came from, which is what stops a fork publishing a score for
      # somebody else's repository.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scorecard only reads; leaving the token in .git/config would give
          # every later step a credential it has no use for.
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: scorecard.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif

