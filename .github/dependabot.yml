version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # Electron majors stay manual — but for a NEW reason, and the old one is
      # worth stating so nobody restores it: this said „no prebuild for Electron
      # 43's ABI“ for four months, and that stopped being true on 2026-09-04 when
      # better-sqlite3-multiple-ciphers 13.0.3 (a Node-API addon, one prebuild per
      # platform, no ABI in the key) was measured loading unchanged under 43 and
      # 44. What still holds is that an Electron major is two Chromium majors of
      # layout and font behaviour landing in an app that is audited by
      # PHOTOGRAPH, and CI cannot run `shots`. A green Dependabot PR would
      # therefore be a green check on the half of the verification that does not
      # matter here. Bump by hand, sweep, look.
      - dependency-name: "electron"
        update-types: ["version-update:semver-major"]
      # Vite is pinned to 7.x by electron-vite, which builds the whole desktop
      # app and declares `vite: ^5 || ^6 || ^7`. Vite 8 does build today, but
      # only by running the build tool outside its supported range; the
      # electron-vite release that adds 8 is still a beta. @vitejs/plugin-react
      # 6 is held for the same reason — it requires vite ^8. Lift both together
      # once electron-vite 6 is stable.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # @types/node describes a runtime, so its major must follow ours rather
      # than lead it: engines says `node: >=24`, every workflow pins
      # `node-version: 24`, and all three specs are `^24.0.0`. Typing against
      # 26 would let code compile against APIs the runtime we test on does not
      # have — and 26 also narrows `BufferSource` to `ArrayBuffer`-backed
      # views, which the crypto ports fail today. Lift when the runtime moves.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
