# Nexus sync — Supabase project configuration.
#
# EVERY VALUE HERE THAT MATTERS IS A SECURITY DECISION, so each one is written
# with its reason. Nothing in this file is a credential and nothing in this file
# may ever become one: keys, project refs and connection strings live in the
# environment, and `supabase/scripts/check-rls-wall.mjs` fails the build if a
# secret-shaped string appears anywhere under `supabase/`.
#
# `project_id` is the LOCAL container name, not a hosted project ref. Linking to
# a real project is a step a human performs with their own credentials
# (`supabase link --project-ref …`), which writes nothing into this file.
project_id = "nexus-sync-local"

[api]
enabled = true
port = 54321

# THE EXPOSED SCHEMA LIST IS PART OF THE WALL. `private` is absent, and its
# absence is what keeps `private.nexus_session_is_live()` and
# `private.pair_rate_limit` off the HTTP surface entirely — the gate predicate
# cannot be probed and the rate-limit counters cannot be reset by a client.
# `graphql_public` is absent too: this product speaks to PostgREST, and a second
# query language over the same tables is a second place for a policy to be
# evaluated differently.
schemas = ["public"]
extra_search_path = ["public", "extensions"]

# A bound on a single response. Sync pulls in pages anyway, driven by the `seq`
# cursor, so this changes nothing for the honest client; what it removes is the
# single request that drags an entire account's ciphertext across the wire.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

# Local mail catcher. Pairing sends no mail; this exists because `generateLink`
# in `pair-complete` runs through GoTrue's mail path even when nothing is
# delivered, and a local project with mail disabled fails that call confusingly.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []

# One hour. Short enough that a leaked access token has a short life, long
# enough that a desktop syncing in the background is not renewing constantly.
# Revocation does not wait for this to elapse: `devices.revoked_at` is checked by
# the restrictive policy on every statement, so a revoked session stops reading
# immediately rather than when its token expires.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# OFF, and this is not a preference. An anonymous sign-in produces a session
# whose role is `authenticated` and whose `auth.uid()` is a real uuid — that is,
# a session that satisfies the tenancy half of every policy in migration 002
# without anybody ever proving anything. It would be gated by the restrictive
# session policy, but relying on the last wall when the first one can simply be
# left up is how a single policy edit becomes a public database.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# MFA IS NOT OPTIONAL FURNITURE HERE. The restrictive policy's first branch is
# `aal = 'aal2'`, and the `pairing` INSERT accepts nothing else — so without an
# enrollable second factor, no account can ever pair a device, and the product
# does not work at all. That is deliberate: it means the security control cannot
# be quietly disabled, because disabling it breaks the feature it protects.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# THE ONE UNAUTHENTICATED ENDPOINT IN THE SYSTEM, and it must be unauthenticated:
# at the moment of the first pairing the desktop has no session, which is the
# entire problem it exists to solve. `verify_jwt = false` therefore removes the
# platform's own gate, and everything that gate would have done is re-established
# inside the function — a 4 KiB body cap before parsing, two independent rate
# limits applied before any state changes, a single-use claim performed in one
# SQL statement, and one indistinguishable refusal for every failure so the
# endpoint cannot be used as an oracle.
[functions.pair-complete]
verify_jwt = false

# `true`, AND IT IS WORTH ALMOST NOTHING — which is exactly why it is written
# here with its own paragraph instead of being left to the default.
#
# The platform's gate accepts ANY JWT this project signed, and the anon key IS
# one: it is a signed JWT printed into every client build. So `verify_jwt = true`
# refuses unsigned noise and nothing else, and an unauthenticated caller still
# reaches the first line of the function. It is on because a free filter is worth
# having, and the real authentication — two tokens, each handed back to the auth
# server for validation, with the session ids taken only from what it confirms —
# is inside `sync-enable/index.ts` where it can be read and tested.
[functions.sync-enable]
verify_jwt = true
