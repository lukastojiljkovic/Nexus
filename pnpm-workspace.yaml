packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  better-sqlite3-multiple-ciphers: true
  electron: true
  electron-winstaller: true
  esbuild: true

# Transitive advisories the dependency that pulls them in cannot fix for us:
# every path below runs through electron-builder, which is already at its
# latest release and still resolves the vulnerable versions. All three are
# build-time only — none ship inside the app — but `pnpm audit --audit-level
# high` (the Security workflow's gate) scans the whole tree, and lifting them
# to the patched patch release is strictly better than narrowing the gate to
# production dependencies. Drop an entry once electron-builder's own tree has
# moved past it. postcss is deliberately NOT listed: vite depends on it by
# caret, so ordinary resolution already lands on a patched release.
overrides:
  # GHSA-3jxr-9vmj-r5cp — DoS via exponential-time brace expansion. Three
  # majors coexist in the tree (via @electron/asar, @electron/universal and
  # ejs>jake>filelist), each with its own patched release.
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.1.2
  brace-expansion@5: ^5.0.8
  # Host confusion via a literal backslash authority delimiter, reached
  # through app-builder-lib > ajv.
  fast-uri@3: ^3.1.4

# The one advisory no version bump can clear. GHSA-mh99-v99m-4gvg declares
# every brace-expansion at or below 5.0.7 affected, and the fix shipped only
# on the 5.x line — so 1.1.16 and 2.1.2, the LATEST releases of the two majors
# minimatch@3 and minimatch@5/9 accept, match it forever. Forcing those call
# sites onto 5.x would mean handing a three-major-old CJS consumer a package
# rewritten in between, to remove a build-time DoS in a glob expander that
# never sees anything but this repo's own file patterns. Recorded as DEV-004
# in docs/deviations.md; drop this the moment electron-builder's tree stops
# reaching brace-expansion 1.x/2.x. Every other advisory still fails the gate.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg
