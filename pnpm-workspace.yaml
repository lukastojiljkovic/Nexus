packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  better-sqlite3-multiple-ciphers: true
  electron: true
  electron-winstaller: true
  esbuild: true

# Transitive advisories the dependency that pulls them in cannot fix for us:
# every path below runs through electron-builder, which is already at its
# latest release and still resolves the vulnerable versions. All three are
# build-time only — none ship inside the app — but the Security workflow audits
# the whole tree, and lifting them to the patched patch release is strictly
# better than narrowing that scan. Drop an entry once electron-builder's own
# tree has moved past it. postcss is deliberately NOT listed: vite depends on
# it by caret, so ordinary resolution already lands on a patched release.
overrides:
  # GHSA-3jxr-9vmj-r5cp — DoS via exponential-time brace expansion. Three
  # majors coexist in the tree (via @electron/asar, @electron/universal and
  # ejs>jake>filelist), each with its own patched release.
  brace-expansion@1: ^1.1.16
  brace-expansion@2: ^2.1.2
  brace-expansion@5: ^5.0.8
  # Host confusion via a literal backslash authority delimiter, reached
  # through app-builder-lib > ajv.
  fast-uri@3: ^3.1.4

# There is deliberately no `auditConfig.ignoreGhsas` here, and `pnpm audit
# --ignore` must not be run in this repo — it does not ignore for one command,
# it WRITES that key. Either way the ignore would then apply to every audit
# invocation, including the one guarding what actually ships, so a
# toolchain-only excuse would silently cover a shipped dependency the day one
# grew the same advisory. The toolchain scan keeps its allow-list in
# .github/scripts/audit-toolchain.mjs, where it covers that scan alone.
