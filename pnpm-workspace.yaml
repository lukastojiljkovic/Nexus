packages:
  - "apps/*"
  - "packages/*"
  # The sync server. It builds nothing and ships no JavaScript to any app — it
  # holds the migrations, the pgTAP suite and the static wall audit. It is a
  # workspace member for one reason: so `pnpm test` runs its static suite and
  # `turbo` sees them. Before this line, `supabase/package.json` declared `test`
  # and `check` scripts that nothing on earth invoked — the exact failure the
  # ci.yml comment above `check:colours` describes, repeated on the one
  # subsystem whose whole job is to be checked.
  - "supabase"
allowBuilds:
  # DENIED, deliberately. 13.0.3 ships eight prebuilt binaries — one per
  # platform and arch, with no ABI in the key, because it is a Node-API addon
  # — so there is nothing here to compile. What the package still carries is a
  # `binding.gyp`, and npm's implicit rule turns that into `install: node-gyp
  # rebuild` for any package that does not set `gypfile: false`. It DOES set it,
  # and pnpm runs the build anyway, so a `true` here fails the install on any
  # machine without Visual Studio's C++ workload — for a binary the package
  # already carries. The explicit `false` is the decision written down; leaving
  # the key out would mean the same thing while reading as an omission.
  better-sqlite3-multiple-ciphers: false
  electron: true
  electron-winstaller: true
  esbuild: true
  # DENIED: none of these four builds anything the app needs on Windows.
  # node-llama-cpp's postinstall only checks for a prebuilt binary and falls back
  # to compiling llama.cpp; the prebuilt ones arrive as its optional
  # `@node-llama-cpp/win-x64*` packages. onnxruntime-node's downloads CUDA
  # binaries on Linux x64 only, and its Windows binaries ship in the package.
  # protobufjs's checks its dependants' version ranges, and tesseract.js's is a
  # donation message.
  node-llama-cpp: false
  onnxruntime-node: false
  protobufjs: false
  tesseract.js: false

# Transitive advisories the dependency that pulls them in cannot fix for us —
# the direct dependency is already at its latest release and still resolves a
# vulnerable version, so ordinary caret resolution can never reach the patch.
#
# **The one rule this list lives by:** an override is allowed to REMOVE a
# vulnerable version from the tree. It is never allowed to make a warning
# quieter. The two are easy to confuse because both end with a green gate, so
# the test is mechanical — after adding an entry, `pnpm why <pkg>` must no
# longer list the affected version. If the version is still installed and only
# the report changed, the entry is a lie and must come out.
#
# This list is therefore ALLOWED TO GROW; what it is not allowed to do is
# outlive its reason. Each entry names the advisory and the condition that
# retires it, and drops the moment the upstream tree moves past it. postcss is
# deliberately NOT listed: vite depends on it by caret, so ordinary resolution
# already lands on a patched release, and an override there would pin a
# transitive we have no business pinning.
overrides:
  # GHSA-3jxr-9vmj-r5cp — DoS via exponential-time brace expansion. Three
  # majors coexist in the tree (via @electron/asar, @electron/universal and
  # ejs>jake>filelist), each with its own patched release. Build-time only,
  # through electron-builder.
  #
  # 2026-10-01 — 1.x and 2.x RAISED to 1.1.20 and 2.1.6 for two more DoS
  # advisories, both uncontrolled recursion: GHSA-6j4f-fj2g-mc7p in
  # `parseCommaParts` and GHSA-qhr7-859c-m2p7 on nested brace groups. 5.x is
  # outside both ranges.
  brace-expansion@1: ^1.1.20
  brace-expansion@2: ^2.1.6
  brace-expansion@5: ^5.0.9
  # Host confusion via a literal backslash authority delimiter, reached
  # through app-builder-lib > ajv. Build-time only.
  #
  # 2026-09-02 — RAISED to 3.1.6 for FOUR more, cut on the same parser on the
  # same day and all patched by the same release: GHSA-jqff-g426-hqxp and
  # GHSA-5jgf-p345-68v8 are host confusion again (a percent-encoded scheme, and
  # a scheme-relative reference whose IDN canonicalisation is skipped), while
  # GHSA-f65p-4m7j-42xc and GHSA-fph4-wmhf-6fwf are SSRF (a malformed IPv6
  # authority, and a hostname percent-decoded more than once). One parser
  # answering „where does this URL point" four different ways is a subsystem
  # finding, not four bugs, which is the argument for taking the whole line
  # rather than the exact patch floor.
  #
  # 2026-09-29 — RAISED to 3.1.7 for TWO more, published together on
  # 2026-09-28 against a release that had been out for four weeks: the same
  # parser's serializer, this time — GHSA-qw65-cvwx-89v3 injects authority
  # through a port it never validates, and GHSA-58mr-gqgx-xq4g is host
  # confusion through an unclosed bracket. The subsystem finding above, a
  # sixth and seventh time.
  #
  # `tar`'s and `browserslist`'s mechanism, not `nanoid`'s: ajv asks for
  # `^3.0.1` and has admitted every one of these releases since it was
  # published, so a clean install with no lockfile lands on the fix by itself.
  # What does not move is the lockfile — 3.1.6 still satisfies `^3.0.1`, and a
  # resolved version that still satisfies its range is never re-resolved.
  # Retires when the lockfile's own resolution reaches 3.1.7.
  fast-uri@3: ^3.1.7
  # GHSA-5p4m-2wfm-xmqj — quadratic CPU in `!!omap` resolution. Reached BOTH
  # ways: `electron-updater` ships it (so the shipped audit sees it) and
  # `app-builder-lib` builds with it. Every dependant asks for `^4.1.0`, so
  # ordinary resolution reaches 4.3.1 on its own — the entry exists because the
  # two halves of the tree otherwise settle on one shared 4.3.0 and the build
  # half keeps it there. Retires when nothing resolves below 4.3.1.
  #
  # 2026-09-09 — RAISED to 4.3.2 for a SECOND advisory cut on the same feature:
  # GHSA-2883-xcg3-v3hh, where `maxTotalMergeKeys` does not bound CPU for EMPTY
  # merge sources. The budget counts keys it copies, so an anchor holding N
  # empty mappings merged into K targets is O(N*K) work at zero cost to the
  # counter — 500 KB of YAML for 13 s of CPU. `^4.3.1` already admitted 4.3.2
  # by caret and the lockfile still would not have moved, which is the quiet
  # way an override goes stale while looking correct (`nanoid`'s note below
  # says the same thing about the same mechanism).
  #
  # Two advisories now, both on the YAML 1.1 merge machinery and both the same
  # shape — a guard that measures the wrong quantity — which is a subsystem
  # finding rather than two bugs. It stays overridden rather than removed
  # because `electron-updater` reads only the update feed WE publish; there is
  # no path from a user's document to this parser. 4.3.2 is the `v4-legacy`
  # tag, and 5.x is a separate major nothing in the tree asks for. Retires when
  # nothing resolves below 4.3.2.
  #
  # 2026-10-07 — `electron-updater` is gone (ADR-089), so the shipped half no
  # longer reaches this parser at all: it is build-time only now, through
  # `app-builder-lib`, reading the builder's own config. The pin stays for the
  # same lockfile reason as before and retires on the same condition.
  js-yaml@4: ^4.3.2
  # GHSA-4cwx-7wf7-3272 — cross-user information disclosure and a parse-time
  # crash via degenerate private cache directives. Build-time only, through
  # electron-builder's fetch path. 6.x is a separate line with its own tree and
  # is not covered by this advisory's range.
  undici@7: ^7.29.0
  # GHSA-rfgv-xxqx-mfg5 — DoS when a server answers with a WebSocket
  # subprotocol the client never requested. Build-time only, through
  # app-builder-lib > @electron/rebuild > node-gyp, which fetches Electron
  # headers and opens no WebSocket at all. Retires when node-gyp's own
  # resolution reaches 6.28.1.
  undici@6: ^6.28.1
  # GHSA-r292-9mhp-454m — uncontrolled recursion in `mapHas`/`filesFilter`, so
  # a crafted archive with a long member path and a selection filter overflows
  # the stack UNCATCHABLY. Build-time only: `tar` arrives through
  # electron-builder (app-builder-lib) and node-gyp, and it reads archives we
  # produce or fetch from the Electron release feed, never user input.
  #
  # It is here for `js-yaml`'s reason, not `nanoid`'s. Both dependants already
  # ask for a caret range that ADMITS the patch — `^7.5.7` and `^7.5.4` against
  # a published 7.5.22 — so a clean install with no lockfile lands on the fix by
  # itself. What does not move is the lockfile: `pnpm update tar -r`, and the
  # same with `--depth Infinity`, both leave 7.5.19 exactly where it is, because
  # a resolved version that still satisfies its range is never re-resolved. The
  # advisory was cut on a tree nothing here had touched. Retires when both
  # dependants' floors clear 7.5.20 — at which point ordinary resolution reaches
  # the patch on its own and this entry must come out.
  tar@7: ^7.5.22
  # GHSA-c83g-rgw3-j3cx — unbounded memory growth: the query cache never evicts,
  # so a process that resolves many distinct browserslist queries grows until it
  # is killed. And GHSA-73wf-gq98-2v4g — `normalizeStats` writes through an
  # untrusted `browserslist-stats.json`, which is a prototype write and a crash.
  #
  # Build-time only, and only just: it arrives through
  # @babel/helper-compilation-targets under electron-vite, @vitejs/plugin-react
  # and eslint-plugin-react-hooks, all devDependencies. Neither reachable
  # condition exists here — this repo resolves one query set from one
  # `browserslist` key and ships no custom stats file at all — but SEC-VER-03
  # blocks on the advisory rather than on my reading of it, and the patch is a
  # lockfile bump away.
  #
  # `tar`'s mechanism exactly: `@babel/helper-compilation-targets` asks for
  # `^4.24.0`, which has admitted 4.28.8 since the day it was published, so a
  # clean install with no lockfile lands on the fix by itself. What does not
  # move is the lockfile — 4.28.4 still satisfies `^4.24.0`, and a resolved
  # version that still satisfies its range is never re-resolved. Retires when
  # the lockfile's own resolution clears 4.28.6.
  browserslist: ^4.28.8
  # GHSA-mwcw-c2x4-8c55 — predictable ids from a non-integer `size`. SHIPPED,
  # not build-time: it arrives through @excalidraw/excalidraw, which pins
  # nanoid at an exact `3.3.3`, and through @excalidraw/mermaid-to-excalidraw,
  # which pins the 4.x line that has no patched release at all (the advisory's
  # fix landed on 3.3.8 and 5.0.9). An exact pin is unreachable by resolution
  # by construction, so an override is the only mechanism there is. Both land
  # on 3.3.16 — the newest 3.x, already in this tree via vite's own toolchain —
  # and 4.x leaves the tree entirely. Retires when Excalidraw stops pinning.
  #
  # 2026-08-08 — RAISED to 3.3.17 for a SECOND, unrelated advisory:
  # GHSA-2v37-7h3g-55p8, an unbounded loop when a custom generator is called
  # with size zero. The old `^3.3.16` would have admitted the patch by ordinary
  # caret resolution, but the lockfile had already settled on 3.3.16 and a
  # range that still matches is never re-resolved — which is the quiet way an
  # override goes stale while still looking correct.
  #
  # 2026-08-15 — RAISED again, to 3.3.18, for THE SAME advisory. Nothing about
  # this tree changed: GHSA-2v37-7h3g-55p8 was re-cut upstream, from
  # „patched in 3.3.17" to „patched in 3.3.18", and the version that was the
  # fix a week ago is the vulnerable version today. Worth stating plainly,
  # because the note above reads as if 3.3.17 settled it — an advisory's range
  # is a moving claim about somebody else's code, and an override pinned to
  # yesterday's edge of it goes red without anything here being touched. Same
  # mechanism as before: `^3.3.17` already admitted 3.3.18 by caret, and the
  # lockfile still would not have moved.
  nanoid: ^3.3.18
  # GHSA-55q2-fjhq-7xh7 — removing an IN_PLACE hook leaves the detached
  # subtree executable, i.e. XSS. SHIPPED, through excalidraw >
  # mermaid-to-excalidraw > mermaid > dompurify, which is precisely the path
  # that sanitises mermaid's generated SVG before the renderer paints it — so
  # this is the sanitiser between untrusted diagram source and our own window,
  # and it is the one advisory in this list I would not ship past. Retires when
  # mermaid's own range reaches 3.4.13.
  #
  # 2026-10-01 — RAISED to 3.4.16 for GHSA-p98j-92pf-mc4p, the same hook
  # family: a node-removing `afterSanitize` hook in IN_PLACE mode leaves the
  # detached subtree's event handlers armed. 3.4.13 through 3.4.15 are
  # vulnerable, so the floor that was the fix is now inside the range. Retires
  # when mermaid's own range reaches 3.4.16.
  dompurify: ^3.4.16
  # GHSA-r5fr-rjxr-66jc / -f23m-r3pf-42rh / -xxjr-mmjv-4gpg — prototype
  # pollution in `_.unset`/`_.omit` via array paths. SHIPPED, through
  # excalidraw > mermaid-to-excalidraw > @mermaid-js/parser > langium >
  # chevrotain.
  #
  # **The advisories' "patched 4.17.24" does not exist.** The registry goes
  # 4.17.23 → 4.18.0 → 4.18.1, so the only release that satisfies `>=4.17.24`
  # is a MINOR bump, not the patch bump the advisory text implies — worth
  # saying out loud, because the next reader will otherwise assume a typo in
  # this file rather than in the advisory. chevrotain imports 39 named lodash
  # functions and none of the changed ones; the suites are what prove it.
  # Retires when chevrotain's own range reaches 4.18.
  lodash-es: ^4.18.1
  # EIGHT advisories, all cut on the same parser within a day of each other
  # (2026-09-08/09) and all patched by one release: GHSA-w2rr-34g9-rvrj and
  # GHSA-4w3w-2rp5-g8jm are `requireWellFormed` bypasses through
  # `createElement`/`setAttribute` (patched 0.8.14); GHSA-c7q8-3ch8-vqpv and
  # GHSA-27p8-2357-5qqv are the same bypass through a processing-instruction
  # target and a DocType name, and GHSA-8344-3jmq-59r6, GHSA-x4fp-j954-r2f4,
  # GHSA-965w-775f-mr7g and GHSA-93r5-fhx6-vmg9 are quadratic time or memory in
  # attribute deduplication, the end-tag trim regex, ordinary parsing and the
  # malformed-input recovery path (all patched 0.8.15).
  #
  # Build-time only, and reached only one way: electron-builder >
  # app-builder-lib > plist, which reads and writes the property lists
  # electron-builder itself generates. Two of the three dependants
  # (@electron/osx-sign, @electron/universal) are macOS packaging and never
  # execute in this repo's builds at all. Neither reachable condition exists
  # here — nothing builds a document from untrusted input, and no XML this repo
  # parses comes from anywhere but its own build — but SEC-VER-03 blocks on the
  # advisory rather than on my reading of it, and the patch is a lockfile bump
  # away.
  #
  # `tar`'s and `browserslist`'s mechanism exactly: `plist` asks for `^0.8.8`,
  # which has admitted 0.8.15 since the day it was published, so a clean
  # install with no lockfile lands on the fix by itself. What does not move is
  # the lockfile — 0.8.13 still satisfies `^0.8.8`, and a resolved version that
  # still satisfies its range is never re-resolved. 0.8.15 is the `lts` tag;
  # the 0.9 line is a separate release train with its own vulnerable range
  # (patched at 0.9.12) that nothing here asks for. Retires when the lockfile's
  # own resolution clears 0.8.15.
  "@xmldom/xmldom@0.8": ^0.8.15
  # GHSA-vfj7-8cjw-p6xm — stack exhaustion through deeply nested patterns in
  # `braces`, and NO release fixes it: 3.0.3 is the last there is, and it is
  # inside the range. SHIPPED by the audit's reckoning, through excalidraw >
  # sass > chokidar@3 > braces, so it cannot be tolerated, only removed.
  # excalidraw pins sass at 1.51.0 and ships its styles compiled; nothing in
  # this repo compiles Sass, so the package is installed and never run. Every
  # sass since 1.79 watches through chokidar 4 or later, which dropped glob
  # support and `braces` with it, so raising sass within its major takes the
  # vulnerable package out of the tree instead of patching around it. EXACTLY
  # 1.79.4: it is the last release before sass took `@parcel/watcher` as a
  # dependency, a native watcher with a build script that would add a
  # second prebuild to the package for a feature nothing here uses. Retires
  # when excalidraw's own sass reaches 1.79.
  "@excalidraw/excalidraw>sass": 1.79.4
  # GHSA-238p-pmpm-9mq7 — prototype pollution that can bypass KaTeX's trust
  # restrictions, fixed in 0.18.2. SHIPPED: the canvas reaches it through
  # @excalidraw/mermaid-to-excalidraw > mermaid, and mermaid still asks for
  # katex ^0.16 in its latest release (12.1.0 at the time of writing). The app's
  # own katex is already on 0.18, so this moves mermaid's copy onto the same
  # patched line. Mermaid's one use is `katex.renderToString` with
  # `throwOnError`, `displayMode` and `output`, all unchanged in 0.18. Retires
  # when mermaid depends on a patched katex itself.
  "mermaid>katex": ^0.18.11
  # GHSA-68fv-2mgg-jv7q — event-loop DoS through indexed source-map section
  # offsets. Development only, through postcss and sass; 1.2.2 is the fix and
  # the same major.
  source-map-js: ^1.2.2

# One four-line patch, and it is a TYPES bug rather than a code one. 13.0.3
# added an `exports` map whose `"."` is a bare `"./lib/index.js"` with no
# `types` condition, and under `moduleResolution: "bundler"` an exports map
# REPLACES the `types` field rather than supplementing it — so the `index.d.ts`
# sitting right there stops being found and the 75 files that import it raise
# TS7016. Patching the package is the fix that reaches every program: the
# alternative is a shim per typecheck project, and this repo has thirteen of
# them, which is thirteen places to forget. The key carries the exact version on
# purpose — a bump that has fixed this upstream will fail to apply the patch,
# and being told to come and look is the whole point of that failure.
patchedDependencies:
  better-sqlite3-multiple-ciphers@13.0.3: patches/better-sqlite3-multiple-ciphers@13.0.3.patch

# `auditConfig.ignoreGhsas` remains FORBIDDEN here — the overrides above are
# allowed to grow precisely because they are the opposite of it. An override
# changes what is installed; an ignore changes only what is said about what is
# installed, and the vulnerable code stays exactly where it was.
#
# `pnpm audit --ignore` must not be run in this repo either: it does not ignore
# for one command, it WRITES that key. Either way the ignore would then apply
# to every audit invocation, including the one guarding what actually ships, so
# a toolchain-only excuse would silently cover a shipped dependency the day one
# grew the same advisory — and a gate taught to stay quiet stays quiet the next
# time too, about something nobody chose to tolerate. The toolchain scan keeps
# its allow-list in .github/scripts/audit-toolchain.mjs, where it covers that
# scan alone, each entry carrying its reasoning and its expiry.
